name: GitHub Pages mirror

# Publishes the real site to https://gh.oriz.in/oriz-me/ as a mirror of
# me.oriz.in. The custom domain lives on the user site (chirag127.github.io), so
# every project site is served under that host with the repository name as the
# first path segment — hence GH_PAGES_BASE. me.oriz.in stays canonical; the
# canonical tags in the markup already point there.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_PAGES_BASE: /oriz-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # The data refresh needs live credentials that this mirror does not hold.
      # Committed snapshots under public/data are what the build reads, and the
      # context file is generated from them by the build script.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
