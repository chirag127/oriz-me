name: build-resume-pdf

on:
  push:
    branches: [main]
    paths:
      - 'public/resume/chirag-singhal-resume.tex'
      - '.github/workflows/build-resume-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (XeLaTeX) + fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-fonts-recommended texlive-latex-extra \
            texlive-fonts-extra fontconfig

      - name: Fetch Awesome-CV class + fonts
        run: |
          git clone --depth 1 https://github.com/posquit0/Awesome-CV.git /tmp/acv
          cp /tmp/acv/awesome-cv.cls public/resume/awesome-cv.cls
          cp -r /tmp/acv/fonts public/resume/fonts

      - name: Compile resume
        working-directory: public/resume
        run: |
          xelatex -interaction=nonstopmode -halt-on-error chirag-singhal-resume.tex
          xelatex -interaction=nonstopmode -halt-on-error chirag-singhal-resume.tex
          test -f chirag-singhal-resume.pdf

      - name: Clean build artifacts (keep .tex + .pdf)
        working-directory: public/resume
        run: |
          rm -rf awesome-cv.cls fonts *.aux *.log *.out

      - name: Commit PDF
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/resume/chirag-singhal-resume.pdf
          git diff --staged --quiet || git commit -m "chore(resume): rebuild PDF from .tex [skip ci]"
          git push
